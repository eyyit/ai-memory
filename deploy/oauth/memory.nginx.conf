server {
  listen 80;
  listen [::]:80;
  server_name memory.example.com;
  access_log off;
  return 308 https://memory.example.com$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name memory.example.com;
  ssl_certificate /acme.sh/example.com_ecc/fullchain.cer;
  ssl_certificate_key /acme.sh/example.com_ecc/example.com.key;
  access_log off;
  error_log /var/log/nginx/memory.example.com_error.log crit;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  client_max_body_size 1m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $memory_upstream ai-memory-oauth;
  location / {
    proxy_pass http://$memory_upstream:8082$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host memory.example.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host memory.example.com;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
