[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-memory"
version = "0.2.0"
license = {file = "LICENSE"}
description = "Vendor-neutral, provenance-aware personal AI memory service"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "qdrant-client>=1.17,<1.19",
  "mcp>=1.30,<2",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
inference = ["torch>=2.6,<3", "transformers>=4.48,<5", "sentence-transformers>=3.4,<6", "huggingface-hub>=0.30,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "pyyaml>=6,<7"]

[project.scripts]
ai-memory = "ai_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
